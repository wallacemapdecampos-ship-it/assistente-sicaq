# Mantém o servidor do Render acordado das 07h às 23h (horário de Brasília).
#
# O plano gratuito do Render dorme após 15 min sem visitas e leva ~1 min
# para acordar. Esta tarefa só acessa /health (não lê documento e não gasta
# a cota da Groq). 07h-23h todos os dias ≈ 500 h/mês, dentro das 750 h
# gratuitas do Render.
#
# Horários em UTC (Brasília = UTC-3):
#   06h55 BRT = 09h55 UTC  -> acorda o servidor antes das 07h
#   07h-20h59 BRT = 10h-23h59 UTC
#   21h-22h59 BRT = 00h-01h59 UTC (último aviso ~22h55; dorme ~23h10)
#
# Para pausar: GitHub > Actions > "Manter servidor acordado" > Disable workflow.

name: Manter servidor acordado

on:
  schedule:
    - cron: "55 9 * * *"
    - cron: "*/5 10-23 * * *"
    - cron: "*/5 0-1 * * *"
    # Dia 1 e 15 de cada mês: renova a tarefa para o GitHub não pausá-la
    # por "60 dias sem atividade" (não altera arquivos nem reinicia o Render).
    - cron: "17 13 1,15 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  renovar:
    if: github.event.schedule == '17 13 1,15 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Renovar a tarefa (evita pausa por inatividade)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/manter-acordado.yml/enable" \
            && echo "Tarefa renovada."

  # O GitHub não garante o "a cada 5 min": na prática dispara a cada 20-40 min.
  # Por isso cada execução fica ativa ~45 min visitando o servidor a cada
  # 4 min; quando a próxima começa, a anterior é encerrada (sem buracos).
  ping:
    if: github.event.schedule != '17 13 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: manter-acordado-ping
      cancel-in-progress: true
    steps:
      - name: Visitar /health a cada 4 min (07h-23h Brasília)
        run: |
          fim=$(( $(date +%s) + 45*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            hhmm=$(TZ=America/Sao_Paulo date +%H%M)
            if [ "$hhmm" -lt 0650 ] || [ "$hhmm" -ge 2300 ]; then
              echo "Fora do horário (07h-23h Brasília): encerrando."
              exit 0
            fi
            curl -sS -m 90 -o /dev/null -w "$(TZ=America/Sao_Paulo date +%H:%M) HTTP %{http_code} em %{time_total}s\n" \
              https://assistente-sicaq.onrender.com/health || echo "sem resposta (pode estar acordando)"
            sleep 240
          done

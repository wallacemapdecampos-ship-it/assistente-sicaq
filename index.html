<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente SICAQ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #1f2937;
    }
    header {
      background: #0867b2;
      color: #fff;
      padding: 28px 40px;
    }
    header h1 { margin: 0 0 6px; font-size: 30px; }
    header p { margin: 0; opacity: .92; }
    .container {
      max-width: 1250px;
      margin: 24px auto;
      padding: 0 20px 40px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab {
      padding: 14px 26px;
      border: 0;
      font-weight: 700;
      background: #e5edf5;
      color: #1f2937;
      border-radius: 3px;
    }
    .tab.active { background: #0867b2; color: white; }
    .card {
      background: white;
      border: 1px solid #d5dde5;
      padding: 22px;
      margin-bottom: 16px;
      border-radius: 6px;
    }
    .statusbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .status {
      font-weight: 700;
    }
    .ok { color: #15803d; }
    .warn { color: #b45309; }
    .erro { color: #b91c1c; }
    .muted { color: #64748b; }
    .upload {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: #0867b2;
      color: white;
      border: 0;
      padding: 12px 22px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 3px;
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .secondary {
      background: #e9eff5;
      color: #1f2937;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 28px;
      margin-top: 15px;
    }
    .campo label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .campo input {
      width: 100%;
      padding: 10px;
      border: 1px solid #9da9b5;
      border-radius: 3px;
      background: #f1faf3;
      font-size: 15px;
      text-transform: uppercase;
    }
    .rodape {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }
    #mensagem {
      margin-top: 12px;
      font-weight: 700;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 22px 20px; }
    }
  </style>
</head>
<body>
<header>
  <h1>ASSISTENTE SICAQ</h1>
  <p>Leitura inteligente de CNH, RG e CIN • preenchimento assistido</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" type="button">IDENTIFICAÇÃO</button>
    <button class="tab" type="button" disabled>HOLERITE</button>
  </div>

  <div class="card">
    <div class="statusbar">
      <h3 style="margin:0">Documento de identificação</h3>
      <div id="statusServidor" class="status warn">Verificando servidor...</div>
    </div>

    <div class="upload">
      <input type="file" id="documento" accept=".pdf,.jpg,.jpeg,.png,.webp">
      <button id="btnLer" type="button" disabled>LER DOCUMENTO</button>
    </div>

    <div id="mensagem" class="muted">
      Aguarde a conexão com o servidor.
    </div>
  </div>

  <div class="card" id="cardDados">
    <div id="tipoDetectado" style="display:none;font-weight:700;font-size:18px;margin-bottom:14px;color:#0b5fa5;"></div>
    <h3>Dados identificados</h3>

    <div class="grid">
      <div class="campo" data-tipos="CNH RG CIN">
        <label>Documento</label>
        <input id="documentoTipo" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Nome</label>
        <input id="nome" type="text">
      </div>

      <div class="campo" data-tipos="RG CIN">
        <label>CPF</label>
        <input id="cpf" type="text">
      </div>

      <div class="campo" data-tipos="RG">
        <label>RG</label>
        <input id="rg" type="text">
      </div>

      <div class="campo" data-tipos="CNH">
        <label>Número CNH</label>
        <input id="numero_cnh" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>UF Emissão</label>
        <input id="uf" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Data Nascimento</label>
        <input id="nascimento" type="text">
      </div>

      <div class="campo" data-tipos="CNH">
        <label>1ª Habilitação</label>
        <input id="primeira" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Data Emissão</label>
        <input id="emissao" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Validade</label>
        <input id="validade" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Sexo</label>
        <input id="sexo" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Nacionalidade</label>
        <input id="nacionalidade" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Naturalidade</label>
        <input id="naturalidade" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Pai</label>
        <input id="pai" type="text">
      </div>

      <div class="campo" data-tipos="CNH RG CIN">
        <label>Mãe</label>
        <input id="mae" type="text">
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;">
      <div id="statusExtensao" class="status warn">Extensão SICAQ: verificando...</div>
      <button id="btnSicaq" type="button" disabled>PREENCHER SICAQ</button>
    </div>
  </div>
</div>

<script>
  const API = "https://assistente-sicaq.onrender.com";
  let ultimoDados = null;
  let extensaoPronta = false;
  let aguardandoSicaq = false;

  const ids = [
    "documentoTipo","nome","cpf","rg","numero_cnh","uf","nascimento",
    "primeira","emissao","validade","sexo","nacionalidade","naturalidade",
    "pai","mae"
  ];

  function setMensagem(texto, classe="muted") {
    const el = document.getElementById("mensagem");
    el.textContent = texto;
    el.className = classe;
  }

  function atualizarBotaoSicaq() {
    const btn = document.getElementById("btnSicaq");
    const temDocumento = !!(document.getElementById("documentoTipo").value || "").trim();
    btn.disabled = !extensaoPronta || !temDocumento || aguardandoSicaq;
  }

  function limparCampos() {
    ids.forEach(id => document.getElementById(id).value = "");
    ultimoDados = null;
    atualizarBotaoSicaq();
  }

  function ajustarCampos(tipo) {
    const t = (tipo || "").toUpperCase().trim();

    document.querySelectorAll(".campo[data-tipos]").forEach(el => {
      const tipos = el.dataset.tipos.split(/\s+/);
      el.style.display = (t && tipos.includes(t)) ? "" : "none";
    });

    const titulo = document.getElementById("tipoDetectado");
    if (t) {
      titulo.textContent = "Tipo identificado pelo Qwen: " + t;
      titulo.style.display = "block";
    } else {
      titulo.textContent = "";
      titulo.style.display = "none";
    }
  }

  function preencher(d) {
    ultimoDados = {...(d || {})};
    const tipo = (d.documento || "").toUpperCase();
    document.getElementById("documentoTipo").value = tipo;
    document.getElementById("nome").value = d.nome || "";
    document.getElementById("cpf").value = d.cpf || "";
    document.getElementById("rg").value = d.rg || "";
    document.getElementById("numero_cnh").value = d.numero_cnh || "";
    document.getElementById("uf").value = d.uf || "";
    document.getElementById("nascimento").value = d.nascimento || "";
    document.getElementById("primeira").value = d.primeira || "";
    document.getElementById("emissao").value = d.emissao || "";
    document.getElementById("validade").value = d.validade || "";
    document.getElementById("sexo").value = d.sexo || "";
    document.getElementById("nacionalidade").value = d.nacionalidade || "";
    document.getElementById("naturalidade").value = d.naturalidade || "";
    document.getElementById("pai").value = d.filiacao1 || "";
    document.getElementById("mae").value = d.filiacao2 || "";
    ajustarCampos(tipo);
    atualizarBotaoSicaq();
  }


  function semAcentos(txt) {
    return String(txt || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function nomeReduzido(nome) {
    const partes = semAcentos(nome).toUpperCase().trim().split(/\s+/).filter(Boolean);
    if (partes.length <= 2) return partes.join(" ");
    const particulas = new Set(["DE","DA","DO","DAS","DOS"]);
    const saida = [partes[0]];
    for (let i = 1; i < partes.length - 1; i++) {
      const p = partes[i];
      saida.push(particulas.has(p) ? p : p.charAt(0));
    }
    saida.push(partes[partes.length - 1]);
    return saida.join(" ");
  }

  function separarNaturalidade(valor) {
    const v = String(valor || "").trim().toUpperCase();
    if (!v) return { municipio: "", uf: "" };
    if (v.includes("/")) {
      const i = v.lastIndexOf("/");
      return { municipio: v.slice(0, i).trim(), uf: v.slice(i + 1).trim() };
    }
    const m = v.match(/^(.*?)[\s-]+([A-Z]{2})$/);
    return m ? { municipio: m[1].trim(), uf: m[2] } : { municipio: v, uf: "" };
  }

  function montarPayloadSicaq() {
    const tipoOrigem = (document.getElementById("documentoTipo").value || "").trim().toUpperCase();
    const nat = separarNaturalidade(document.getElementById("naturalidade").value);
    const modelo = String((ultimoDados && ultimoDados.modelo_documento) || "").toUpperCase();
    const cpf = (document.getElementById("cpf").value || "").replace(/\D/g, "");
    const rg = (document.getElementById("rg").value || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();

    let tipoSicaq = tipoOrigem;
    if (tipoOrigem === "RG" || tipoOrigem === "CIN") {
      tipoSicaq = "DOCUMENTO DE IDENTIFICAÇÃO";
    } else if (tipoOrigem === "CNH") {
      tipoSicaq = "CNH - CARTEIRA NACIONAL DE HABILITAÇÃO";
    }

    let numeroIdentidade = "";
    if (tipoOrigem === "CIN" || modelo === "NOVO" || modelo === "NOVA") {
      numeroIdentidade = cpf || rg;
    } else if (tipoOrigem === "RG") {
      numeroIdentidade = rg || cpf;
    }

    return {
      nome_reduzido: nomeReduzido(document.getElementById("nome").value),
      sexo: (document.getElementById("sexo").value || "").toUpperCase(),
      nacionalidade: "BRASILEIRA",
      naturalidade_uf: nat.uf,
      naturalidade_municipio: nat.municipio,
      filiacao_1: (document.getElementById("pai").value || "").toUpperCase(),
      filiacao_2: (document.getElementById("mae").value || "").toUpperCase(),
      grau_instrucao: "ENSINO MÉDIO COMPLETO",
      tipo_documento: tipoSicaq,
      tipo_documento_origem: tipoOrigem,
      orgao_emissor: tipoOrigem === "CNH"
        ? "ÓRGÃO DE TRÂNSITO"
        : String((ultimoDados && ultimoDados.orgao_emissor) || "").toUpperCase(),
      uf_emissao: (document.getElementById("uf").value || "").toUpperCase(),
      numero_cnh: document.getElementById("numero_cnh").value || "",
      data_primeira_habilitacao: document.getElementById("primeira").value || "",
      data_emissao: document.getElementById("emissao").value || "",
      validade: document.getElementById("validade").value || "",
      numero_identidade: numeroIdentidade,
      checkboxes: [
        "Movimentação de Conta de Depósito/Poupança",
        "Empréstimos/Financiamentos",
        "Cartão de Crédito"
      ],
      financiamento_habitacional: "SIM"
    };
  }

  function preencherSicaq() {
    if (!extensaoPronta) {
      setMensagem("A extensão SICAQ não foi detectada. Recarregue a extensão e atualize esta página.", "erro");
      return;
    }
    const tipo = (document.getElementById("documentoTipo").value || "").trim();
    if (!tipo) {
      setMensagem("Leia um documento antes de preencher o SICAQ.", "erro");
      return;
    }

    aguardandoSicaq = true;
    atualizarBotaoSicaq();
    document.getElementById("btnSicaq").textContent = "PREENCHENDO...";
    setMensagem("Enviando os dados para a extensão. Deixe a página Dados Cadastrais do SICAQ aberta e logada.", "warn");

    window.postMessage({
      source: "ASSISTENTE_SICAQ_SITE",
      type: "FILL_SICAQ",
      id: `site-${Date.now()}`,
      payload: montarPayloadSicaq()
    }, window.location.origin);
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window || event.origin !== window.location.origin) return;
    const msg = event.data || {};
    if (msg.source !== "ASSISTENTE_SICAQ_EXTENSION") return;

    if (msg.type === "EXTENSION_READY") {
      extensaoPronta = true;
      const el = document.getElementById("statusExtensao");
      el.textContent = "Extensão SICAQ conectada";
      el.className = "status ok";
      atualizarBotaoSicaq();
      return;
    }

    if (msg.type === "SICAQ_ACCEPTED" && !msg.ok) {
      aguardandoSicaq = false;
      document.getElementById("btnSicaq").textContent = "PREENCHER SICAQ";
      atualizarBotaoSicaq();
      setMensagem("A extensão não aceitou o comando: " + (msg.error || "erro desconhecido"), "erro");
      return;
    }

    if (msg.type === "SICAQ_RESULT") {
      aguardandoSicaq = false;
      document.getElementById("btnSicaq").textContent = "PREENCHER SICAQ";
      atualizarBotaoSicaq();
      const r = msg.result || {};
      if (r.ok) {
        setMensagem("Dados preenchidos no SICAQ com sucesso.", "ok");
      } else {
        const erros = (r.erros || []).join(" | ") || "O preenchimento não foi concluído.";
        setMensagem("SICAQ: " + erros, "erro");
      }
    }
  });

  function pingExtensao() {
    window.postMessage({
      source: "ASSISTENTE_SICAQ_SITE",
      type: "PING_EXTENSION"
    }, window.location.origin);
  }

  async function checarServidor() {
    const status = document.getElementById("statusServidor");
    const btn = document.getElementById("btnLer");
    status.textContent = "Conectando ao servidor...";
    status.className = "status warn";

    try {
      const resp = await fetch(API + "/health", { cache: "no-store" });
      const data = await resp.json();

      if (!resp.ok || !data.ok || !data.groq_configurada) {
        throw new Error("Servidor ou Groq indisponível.");
      }

      status.textContent = "Servidor online • Groq/Qwen configurado";
      status.className = "status ok";
      btn.disabled = false;
      setMensagem("Selecione um documento e clique em LER DOCUMENTO.", "muted");
    } catch (e) {
      status.textContent = "Servidor iniciando ou indisponível";
      status.className = "status erro";
      btn.disabled = true;
      setMensagem("No plano gratuito do Render, a primeira conexão pode demorar até cerca de 1 minuto. Tentando novamente...", "warn");
      setTimeout(checarServidor, 8000);
    }
  }

  async function lerDocumento() {
    const input = document.getElementById("documento");
    const btn = document.getElementById("btnLer");

    if (!input.files.length) {
      setMensagem("Selecione um PDF ou imagem primeiro.", "erro");
      return;
    }

    limparCampos();
    ajustarCampos("");
    btn.disabled = true;
    btn.textContent = "LENDO...";
    setMensagem("Enviando o documento para leitura. Aguarde...", "warn");

    const form = new FormData();
    form.append("file", input.files[0]);

    const inicio = performance.now();

    try {
      const resp = await fetch(API + "/ler", {
        method: "POST",
        body: form
      });

      let data;
      try {
        data = await resp.json();
      } catch {
        throw new Error("Resposta inválida do servidor.");
      }

      if (!resp.ok || !data.ok) {
        throw new Error(data.error || "Falha na leitura.");
      }

      preencher(data.dados || {});
      const total = ((performance.now() - inicio) / 1000).toFixed(2);
      const api = data.tempo_api ? ` • Groq/Qwen: ${data.tempo_api}s` : "";
      setMensagem(`Leitura concluída em ${total}s${api}. Revise os dados antes de continuar.`, "ok");
    } catch (e) {
      setMensagem("Erro: " + (e.message || e), "erro");
    } finally {
      btn.disabled = false;
      btn.textContent = "LER DOCUMENTO";
    }
  }

  document.getElementById("btnLer").addEventListener("click", lerDocumento);
  document.getElementById("btnSicaq").addEventListener("click", preencherSicaq);
  document.getElementById("documento").addEventListener("change", () => {
    limparCampos();
    ajustarCampos("");
  });

  ajustarCampos("");
  checarServidor();
  pingExtensao();
  setInterval(() => { if (!extensaoPronta) pingExtensao(); }, 1500);
</script>
</body>
</html>

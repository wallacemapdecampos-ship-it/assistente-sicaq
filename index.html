<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente SICAQ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #1f2937;
    }

    header {
      background: #0867b2;
      color: white;
      padding: 28px 40px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab {
      padding: 14px 26px;
      border: 0;
      cursor: pointer;
      font-weight: bold;
      background: #e5edf5;
    }

    .tab.active {
      background: #0867b2;
      color: white;
    }

    .card {
      background: white;
      border: 1px solid #d5dde5;
      padding: 22px;
      margin-bottom: 16px;
      border-radius: 5px;
    }

    .upload {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: #0867b2;
      color: white;
      border: 0;
      padding: 12px 22px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
    }

    .secondary {
      background: #e9eff5;
      color: #1f2937;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 28px;
      margin-top: 15px;
    }

    .campo label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .campo input {
      width: 100%;
      padding: 10px;
      border: 1px solid #9da9b5;
      border-radius: 3px;
      background: #f1faf3;
    }

    .rodape {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ASSISTENTE SICAQ</h1>
  <p>Leitura inteligente de CNH, RG e CIN • preenchimento assistido</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active">IDENTIFICAÇÃO</button>
    <button class="tab">HOLERITE</button>
  </div>

  <div class="card">
    <h3>Documento de identificação</h3>

    <div class="upload">
      <input type="file" id="documento" accept=".pdf,.jpg,.jpeg,.png">
      <button>LER DOCUMENTO</button>
    </div>
  </div>

  <div class="card">
    <h3>Dados identificados</h3>

    <div class="grid">

      <div class="campo">
        <label>Documento</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Nome</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>CPF</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>RG</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>UF Emissão</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Data Nascimento</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Sexo</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Nacionalidade</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Naturalidade</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Pai</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Mãe</label>
        <input type="text">
      </div>

    </div>

    <div class="rodape">
      <button>PREENCHER SICAQ</button>
    </div>
  </div>

</div>

</body>
</html>
